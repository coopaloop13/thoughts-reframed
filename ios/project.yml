name: ReframedThoughts
options:
  bundleIdPrefix: com.coopertech
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
packages:
  Apollo:
    url: https://github.com/apollographql/apollo-ios
    from: 2.4.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""   # set your team id here for device builds
targets:
  ReframedThoughts:
    type: application
    platform: iOS
    sources:
      - path: ReframedThoughts
        excludes: ["Resources/Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coopertech.reframedthoughts
        INFOPLIST_FILE: ReframedThoughts/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReframedThoughts/Resources/ReframedThoughts.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: Apollo
        product: Apollo
      - package: Apollo
        product: ApolloWebSocket
      - package: Apollo
        product: ApolloAPI
  ReframedThoughtsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ReframedThoughtsTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coopertech.reframedthoughtsTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ReframedThoughts
schemes:
  ReframedThoughts:
    build:
      targets: { ReframedThoughts: all, ReframedThoughtsTests: [test] }
    run:
      config: Debug
      environmentVariables:
        - variable: API_BASE_URL
          value: http://localhost:8080
          isEnabled: true
        - variable: DEV_JWT
          value: ""
          isEnabled: false
    test:
      config: Debug
      targets: [ReframedThoughtsTests]
