type AuthPayload {
  token: String!
  user: User!
}

scalar DateTime

scalar File

type Mutation {
  createSession(recording: File!): Session!
  deleteAccount: Boolean!
  enrollVoice(referenceText: String!, sample: File!): User!
  previewVoice: String!
  sendTurn(recording: File!, sessionId: ID!): Turn!
  signInWithApple(identityToken: String!): AuthPayload!
}

type Query {
  me: User!
  session(id: ID!): Session
  sessions(before: DateTime, limit: Int = 20): [Session!]!
}

type Session {
  audioUrl: String
  createdAt: DateTime!
  crisis: Boolean!
  error: String
  id: ID!
  reframedText: String
  status: SessionStatus!
  transcript: String
  turns: [Turn!]!
}

enum SessionStatus {
  COMPLETED
  FAILED
  REFRAMING
  SYNTHESIZING
  TRANSCRIBING
  UPLOADED
}

type Subscription {
  sessionUpdated(id: ID!): Session!
  turnUpdated(id: ID!): Turn!
}

type Turn {
  agentText: String
  audioUrl: String
  closing: Boolean!
  createdAt: DateTime!
  crisis: Boolean!
  error: String
  id: ID!
  status: SessionStatus!
  userText: String
}

type User {
  hasVoice: Boolean!
  id: ID!
  profile: String
}
